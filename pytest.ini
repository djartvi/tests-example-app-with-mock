[pytest]
testpaths = tests
pythonpath = .
# --allure-no-capture: stdout в отчёт не вкладываем - запрос и ответ приходят
# отдельным вложением на шаг (base/reporter.py::Reporter.attach).
# --dist loadgroup: без него -n игнорирует xdist_group, и тесты @no_token разъедутся по воркерам.
addopts = -ra --allure-no-capture --dist loadgroup
